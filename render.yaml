# Render deployment config (alternative to Vercel).
# In Render: New + > Blueprint, point at this repo. Set the env vars below
# in the dashboard (do NOT commit real values).
services:
  - type: web
    name: wakud-os
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
